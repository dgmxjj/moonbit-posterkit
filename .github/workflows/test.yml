name: Check and Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit (Unix)
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install native dependencies (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: sudo apt-get update && sudo apt-get install -y gcc libssl-dev

      - name: Install native dependencies (macOS)
        if: ${{ matrix.os == 'macos-latest' }}
        run: brew install gcc openssl

      - name: Install native dependencies (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl

      - name: Toolchain and dependencies
        run: |
          moon version --all
          moon update

      - name: Moon check
        run: moon check --deny-warn --target all

      - name: Moon test
        run: moon test --deny-warn --target all

      - name: Format and interface lint
        run: |
          moon fmt
          git diff --exit-code
          moon info
          git diff --exit-code

      - name: Native coverage
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          moon test --deny-warn --target native --enable-coverage
          moon coverage report -f summary
          moon coverage analyze

      - name: CLI smoke tests
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          rm -rf ci-rendered
          moon run --target native src/cli list-templates | grep digest
          moon run --target native src/cli validate --strict examples/batches/hackathon-showcase.json
          moon run --target native src/cli inspect examples/batches/hackathon-showcase.json
          moon run --target native src/cli benchmark examples/benchmarks/batch-10.json 2
          moon run --target native src/cli batch examples/batches/hackathon-showcase.json ci-rendered
          test -f ci-rendered/launch-square.svg
          moon run --target native src/cli export png examples/batches/release-note-pack.json ci-rendered/png
          moon run --target native src/cli export pdf examples/batches/release-note-pack.json ci-rendered/pdf
          test -f ci-rendered/png/release-note-card.png
          test -f ci-rendered/pdf/release-note-card.pdf
