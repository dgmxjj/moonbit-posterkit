<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" data-title="One content source, many aspect ratios"><rect width="100%" height="100%" fill="#f8f0e3" /><rect id="digest-shell" x="96" y="96" width="888" height="888" rx="32" fill="#fffef8" /><g id="digest-hero" data-asset-id="feature-digest-art" data-fit="cover"><rect x="552" y="96" width="432" height="584" fill="none" stroke="#7c6f64" stroke-width="3" stroke-dasharray="12 8" /><text x="768" y="388" fill="#7c6f64" font-family="Arial, Noto Sans SC, sans-serif" font-size="26" text-anchor="middle">Replace Feature Digest Art</text></g><text id="digest-eyebrow" x="96" y="120" fill="#ef7d57" font-family="Arial, Noto Sans SC, sans-serif" font-size="24" font-weight="700" text-anchor="start" data-max-width="432">Feature Digest</text><text id="digest-title-1" x="96" y="144" fill="#ef7d57" font-family="Georgia, Source Han Serif SC, serif" font-size="100" font-weight="700" text-anchor="start" data-max-width="432">One</text><text id="digest-title-2" x="96" y="260" fill="#ef7d57" font-family="Georgia, Source Han Serif SC, serif" font-size="100" font-weight="700" text-anchor="start" data-max-width="432">content</text><text id="digest-title-3" x="96" y="376" fill="#ef7d57" font-family="Georgia, Source Han Serif SC, serif" font-size="100" font-weight="700" text-anchor="start" data-max-width="432">source,</text><text id="digest-title-4" x="96" y="492" fill="#ef7d57" font-family="Georgia, Source Han Serif SC, serif" font-size="100" font-weight="700" text-anchor="start" data-max-width="432">many</text><text id="digest-title-5" x="96" y="608" fill="#ef7d57" font-family="Georgia, Source Han Serif SC, serif" font-size="100" font-weight="700" text-anchor="start" data-max-width="432">aspect</text><text id="digest-title-6" x="96" y="724" fill="#ef7d57" font-family="Georgia, Source Han Serif SC, serif" font-size="100" font-weight="700" text-anchor="start" data-max-width="432">ratios</text><text id="digest-summary-1" x="96" y="376" fill="#1f1a17" font-family="Arial, Noto Sans SC, sans-serif" font-size="34" font-weight="400" text-anchor="start" data-max-width="432">Square and wide digest</text><text id="digest-summary-2" x="96" y="424" fill="#1f1a17" font-family="Arial, Noto Sans SC, sans-serif" font-size="34" font-weight="400" text-anchor="start" data-max-width="432">cards can share the same</text><text id="digest-summary-3" x="96" y="472" fill="#1f1a17" font-family="Arial, Noto Sans SC, sans-serif" font-size="34" font-weight="400" text-anchor="start" data-max-width="432">structure. Turn</text><text id="digest-summary-4" x="96" y="520" fill="#1f1a17" font-family="Arial, Noto Sans SC, sans-serif" font-size="34" font-weight="400" text-anchor="start" data-max-width="432">summary-heavy</text><text id="digest-summary-5" x="96" y="568" fill="#1f1a17" font-family="Arial, Noto Sans SC, sans-serif" font-size="34" font-weight="400" text-anchor="start" data-max-width="432">announcements into</text><text id="digest-summary-6" x="96" y="616" fill="#1f1a17" font-family="Arial, Noto Sans SC, sans-serif" font-size="34" font-weight="400" text-anchor="start" data-max-width="432">reusable visual blocks</text><text id="digest-summary-7" x="96" y="664" fill="#1f1a17" font-family="Arial, Noto Sans SC, sans-serif" font-size="34" font-weight="400" text-anchor="start" data-max-width="432">that still read clearly</text><text id="digest-summary-8" x="96" y="712" fill="#1f1a17" font-family="Arial, Noto Sans SC, sans-serif" font-size="34" font-weight="400" text-anchor="start" data-max-width="432">at a glance.</text><rect id="digest-footer-panel" x="96" y="704" width="888" height="280" rx="24" fill="#111111" /><text id="digest-cta" x="124" y="736" fill="#ffffff" font-family="Arial, Noto Sans SC, sans-serif" font-size="24" font-weight="700" text-anchor="start" data-max-width="832">Read the recap</text><text id="digest-footer" x="124" y="790" fill="#f3f3f3" font-family="Arial, Noto Sans SC, sans-serif" font-size="24" font-weight="400" text-anchor="start" data-max-width="832">feature digest / square card / release notes</text></svg>