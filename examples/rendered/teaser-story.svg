<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" data-title="Launch visuals from typed configs"><rect width="100%" height="100%" fill="#fffdf6" /><rect id="launch-shell" x="84" y="84" width="912" height="1752" rx="36" fill="#fffaf2" /><text id="launch-eyebrow" x="84" y="106" fill="#0057ff" font-family="Arial, Noto Sans SC, sans-serif" font-size="22" font-weight="700" text-anchor="start" data-max-width="912">MoonBit PosterKit</text><text id="launch-subtitle" x="84" y="182" fill="#111111" font-family="Arial, Noto Sans SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" data-max-width="912">Create poster, story, and cover systems in MoonBit.</text><g id="launch-hero" data-asset-id="teaser-image" data-fit="cover"><rect x="84" y="440" width="912" height="380" fill="none" stroke="#7c6f64" stroke-width="3" stroke-dasharray="12 8" /><text x="540" y="630" fill="#7c6f64" font-family="Arial, Noto Sans SC, sans-serif" font-size="26" text-anchor="middle">Replace Teaser Image</text></g><text id="launch-cta" x="84" y="874" fill="#0057ff" font-family="Arial, Noto Sans SC, sans-serif" font-size="22" font-weight="700" text-anchor="start" data-max-width="912">Batch render / swap content / keep hierarchy</text><text id="launch-footer" x="84" y="948" fill="#7b7b7b" font-family="Arial, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" data-max-width="912">template launch / preset social-story / theme swiss-grid</text><text id="launch-title-1" x="84" y="148" fill="#111111" font-family="Georgia, Source Han Serif SC, serif" font-size="88" font-weight="700" text-anchor="start" data-max-width="912">Launch visuals from</text><text id="launch-title-2" x="84" y="254" fill="#111111" font-family="Georgia, Source Han Serif SC, serif" font-size="88" font-weight="700" text-anchor="start" data-max-width="912">typed configs</text><text id="launch-body-1" x="84" y="892" fill="#111111" font-family="Arial, Noto Sans SC