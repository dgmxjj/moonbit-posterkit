<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" data-title="From config to campaign"><rect width="100%" height="100%" fill="#fffdf6" /><rect id="event-panel" x="84" y="84" width="912" height="1752" rx="32" fill="#fffaf2" /><g id="event-image" data-asset-id="event-story" data-fit="cover"><rect x="552" y="84" width="444" height="864" fill="none" stroke="#7c6f64" stroke-width="3" stroke-dasharray="12 8" /><text x="774" y="516" fill="#7c6f64" font-family="Arial, Noto Sans SC, sans-serif" font-size="26" text-anchor="middle">Replace Event Story Image</text></g><text id="event-title-1" x="84" y="84" fill="#111111" font-family="Georgia, Source Han Serif SC, serif" font-size="88" font-weight="700" text-anchor="start" data-max-width="444">From</text><text id="event-title-2" x="84" y="190" fill="#111111" font-family="Georgia, Source Han Serif SC, serif" font-size="88" font-weight="700" text-anchor="start" data-max-width="444">config to</text><text id="event-title-3" x="84" y="296" fill="#111111" font-family="Georgia, Source Han Serif SC, serif" font-size="88" font-weight="700" text-anchor="start" data-max-width="444">campaign</text><text id="event-detail-1" x="84" y="304" fill="#111111" font-family="Arial, Noto Sans SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" data-max-width="444">A story-sized variant for</text><text id="event-detail-2" x="84" y="350" fill="#111111" font-family="Arial, Noto Sans SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" data-max-width="444">fast event promotion. Use</text><text id="event-detail-3" x="84" y="396" fill="#111111" font-family="Arial, Noto Sans SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" data-max-width="444">the same content model for</text><text id="event-detail-4" x="84" y="442" fill="#111111" font-family="Arial, Noto Sans SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" data-max-width="444">vertical stories, squares,</text><text id="event-detail-5" x="84" y="488" fill="#111111" font-family="Arial, Noto Sans SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" data-max-width="444">and wide thumbnails. One</text><text id="event-detail-6" x="84" y="534" fill="#111111" font-family="Arial, Noto Sans SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" data-max-width="444">content source / many</text><text id="event-detail-7" x="84" y="580" fill="#111111" font-family="Arial, Noto Sans SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" data-max-width="444">aspect ratios</text><text id="event-footer" x="84" y="994" fill="#0057ff" font-family="Arial, Noto Sans SC, sans-serif" font-size="22" font-weight="700" text-anchor="start" data-max-width="912">vertical social pack / automated output</text><text id="event-eyebrow" x="84" y="1044" fill="#7b7b7b" font-family="Arial, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" data-max-width="912">MoonBit Hackathon</text></svg>