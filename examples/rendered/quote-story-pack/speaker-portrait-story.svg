<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" data-title="Templates are most useful when they survive edits, handoffs, and release pressure."><rect width="100%" height="100%" fill="#fffdf6" /><rect id="quote-shell" x="84" y="84" width="912" height="1752" rx="36" fill="#fffaf4" /><rect id="quote-kicker" x="84" y="84" width="260" height="54" rx="14" fill="#0057ff" /><text id="quote-kicker-text" x="102" y="118" fill="#ffffff" font-family="Arial, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" data-max-width="220">Speaker Note</text><text id="quote-title-1" x="84" y="146" fill="#111111" font-family="Georgia, Source Han Serif SC, serif" font-size="98" font-weight="700" text-anchor="start" data-max-width="912">Templates are most</text><text id="quote-title-2" x="84" y="256" fill="#111111" font-family="Georgia, Source Han Serif SC, serif" font-size="98" font-weight="700" text-anchor="start" data-max-width="912">useful when they</text><text id="quote-title-3" x="84" y="366" fill="#111111" font-family="Georgia, Source Han Serif SC, serif" font-size="98" font-weight="700" text-anchor="start" data-max-width="912">survive edits,</text><text id="quote-title-4" x="84" y="476" fill="#111111" font-family="Georgia, Source Han Serif SC, serif" font-size="98" font-weight="700" text-anchor="start" data-max-width="912">handoffs, and</text><text id="quote-title-5" x="84" y="586" fill="#111111" font-family="Georgia, Source Han Serif SC, serif" font-size="98" font-weight="700" text-anchor="start" data-max-width="912">release pressure.</text><text id="quote-author" x="84" y="616" fill="#111111" font-family="Arial, Noto Sans SC, sans-serif" font-size="22" font-weight="700" text-anchor="start" data-max-width="652">Hackathon Workshop Host</text><text id="quote-support-1" x="84" y="642" fill="#111111" font-family="Arial, Noto Sans SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" data-max-width="652">Use the same content schema for square</text><text id="quote-support-2" x="84" y="688" fill="#111111" font-family="Arial, Noto Sans SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" data-max-width="652">pull quotes, story slides, and</text><text id="quote-support-3" x="84" y="734" fill="#111111" font-family="Arial, Noto Sans SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" data-max-width="652">event-side speaker cards. Story portrait</text><text id="quote-support-4" x="84" y="780" fill="#111111" font-family="Arial, Noto Sans SC, sans-serif" font-size="32" font-weight="400" text-anchor="start" data-max-width="652">/ event teaser</text><text id="quote-footer" x="84" y="836" fill="#7b7b7b" font-family="Arial, Noto Sans SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" data-max-width="652">quote story / portrait / swipes</text><g id="quote-portrait" data-asset-id="speaker-portrait" data-fit="cover"><rect x="776" y="594" width="220" height="220" fill="none" stroke="#7c6f64" stroke-width="3" stroke-dasharray="12 8" /><text x="886" y="704" fill="#7c6f64" font-family="Arial, Noto Sans SC, sans-serif" font-size="26" text-anchor="middle">Replace Speaker Portrait</text></g></svg>