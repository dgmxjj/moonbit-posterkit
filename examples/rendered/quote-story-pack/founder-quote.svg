<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" data-title="Design systems become momentum once they can be reused and reviewed in code."><rect width="100%" height="100%" fill="#f8f0e3" /><rect id="quote-shell" x="96" y="96" width="888" height="888" rx="36" fill="#fffaf4" /><rect id="quote-kicker" x="96" y="96" width="260" height="54" rx="14" fill="#ef7d57" /><text id="quote-kicker-text" x="114" y="130" fill="#ffffff" font-family="Arial, Noto Sans SC, sans-serif" font-size="24" font-weight="400" text-anchor="start" data-max-width="220">Builder Quote</text><text id="quote-title-1" x="96" y="160" fill="#1f1a17" font-family="Georgia, Source Han Serif SC, serif" font-size="106" font-weight="700" text-anchor="start" data-max-width="888">Design systems</text><text id="quote-title-2" x="96" y="278" fill="#1f1a17" font-family="Georgia, Source Han Serif SC, serif" font-size="106" font-weight="700" text-anchor="start" data-max-width="888">become momentum</text><text id="quote-title-3" x="96" y="396" fill="#1f1a17" font-family="Georgia, Source Han Serif SC, serif" font-size="106" font-weight="700" text-anchor="start" data-max-width="888">once they can be</text><text id="quote-title-4" x="96" y="514" fill="#1f1a17" font-family="Georgia, Source Han Serif SC, serif" font-size="106" font-weight="700" text-anchor="start" data-max-width="888">reused and</text><text id="quote-title-5" x="96" y="632" fill="#1f1a17" font-family="Georgia, Source Han Serif SC, serif" font-size="106" font-weight="700" text-anchor="start" data-max-width="888">reviewed in</text><text id="quote-title-6" x="96" y="750" fill="#1f1a17" font-family="Georgia, Source Han Serif SC, serif" font-size="106" font-weight="700" text-anchor="start" data-max-width="888">code.</text><text id="quote-author" x="96" y="632" fill="#1f1a17" font-family="Arial, Noto Sans SC, sans-serif" font-size="24" font-weight="700" text-anchor="start" data-max-width="628">MoonBit Community</text><text id="quote-support-1" x="96" y="656" fill="#1f1a17" font-family="Arial, Noto Sans SC, sans-serif" font-size="34" font-weight="400" text-anchor="start" data-max-width="628">Pair structured layouts with typed</text><text id="quote-support-2" x="96" y="704" fill="#1f1a17" font-family="Arial, Noto Sans SC, sans-serif" font-size="34" font-weight="400" text-anchor="start" data-max-width="628">content so quotes, promos, and</text><text id="quote-support-3" x="96" y="752" fill="#1f1a17" font-family="Arial, Noto Sans SC, sans-serif" font-size="34" font-weight="400" text-anchor="start" data-max-width="628">recaps all stay consistent. Share</text><text id="quote-support-4" x="96" y="800" fill="#1f1a17" font-family="Arial, Noto Sans SC, sans-serif" font-size="34" font-weight="400" text-anchor="start" data-max-width="628">the idea / keep the voice</text><text id="quote-footer" x="96" y="850" fill="#7c6f64" font-family="Arial, Noto Sans SC, sans-serif" font-size="24" font-weight="400" text-anchor="start" data-max-width="628">quote card / portrait / social square</text><g id="quote-portrait" data-asset-id="founder-portrait" data-fit="cover"><rect x="764" y="608" width="220" height="220" fill="none" stroke="#7c6f64" stroke-width="3" stroke-dasharray="12 8" /><text x="874" y="718" fill="#7c6f64" font-family="Arial, Noto Sans SC, sans-serif" font-size="26" text-anchor="middle">Replace Founder Portrait</text></g></svg>